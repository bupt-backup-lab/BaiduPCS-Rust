name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 支持手动触发

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只保留 amd64 的 musl 版本
          - platform: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
            binary: baidu-netdisk-rust
            use_zigbuild: true
            
          # 只保留 arm64 的 musl 版本
          - platform: linux-arm64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar
            binary: baidu-netdisk-rust
            use_zigbuild: true

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-20.04'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev zip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.87.0
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild == true
        run: |
          pip3 install ziglang
          # Pin to a version compatible with the pinned rustc (1.87); 0.23+ requires rustc 1.88
          cargo install cargo-zigbuild --version 0.21.8 --locked
          # Verify installation by checking if command exists
          command -v cargo-zigbuild || which cargo-zigbuild || echo "cargo-zigbuild installed"

      - name: Build backend
        shell: bash
        env:
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: |
          set -e
          cd backend
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            echo "Building with cargo-zigbuild for ${{ matrix.target }}..."
            # Enable OpenSSL vendored for cross-compilation to musl targets
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            echo "Building with cargo for ${{ matrix.target }}..."
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare package
        shell: bash
        run: |
          set -e
          ARTIFACT_NAME=BaiduPCS-Rust-${GITHUB_REF_NAME}-${{ matrix.platform }}
          export ARTIFACT_NAME
          PKG_DIR=release/$ARTIFACT_NAME
          mkdir -p "$PKG_DIR"

          BIN_PATH="backend/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "$BIN_PATH" "$PKG_DIR/"
          chmod +x "$PKG_DIR/${{ matrix.binary }}" || true

          cp -R frontend/dist "$PKG_DIR/frontend"
          mkdir -p "$PKG_DIR/config"
          cp config/app.toml.example "$PKG_DIR/config/app.toml.example"
          cp config/app.toml.example "$PKG_DIR/config/app.toml"
          cp README.md "$PKG_DIR/README.md"

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          # 剔除了 zip 分支逻辑，因为当前 matrix 只有 tar
          ARCHIVE_PATH="release/${ARTIFACT_NAME}.tar.gz"
          tar czf "$ARCHIVE_PATH" -C release "$ARTIFACT_NAME"
          
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
